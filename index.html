<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facultad Virtual VR</title>

    <link rel="stylesheet" href="/css/styles.css" />

  </head>
  <body>
    <!-- Panel de información -->
    <div class="info-panel">
      <h3 class="panel-title"><span data-lucide-icon="landmark"></span>Facultad Virtual VR</h3>
      <p><strong>PC:</strong> WASD para moverse, Mouse para mirar</p>
      <p><strong>VR:</strong> Gatillo para teletransportarte</p>
      <div class="location">
        <p class="icon-row"><span data-lucide-icon="map-pin"></span>Pasillo Principal</p>
        <p class="icon-row"><span data-lucide-icon="door-open"></span>Impar izquierda | Par derecha</p>
        <p class="icon-row"><span data-lucide-icon="door-open"></span>1 Analisis Matematico | 2 Programación</p>
        <p class="icon-row"><span data-lucide-icon="door-open"></span>3 CPU | 4 Fisica</p>
        <p class="icon-row"><span data-lucide-icon="door-open"></span>5 Probabilidad | 6 Complejidad</p>
      </div>
    </div>

    <template id="scene-template">
    <a-scene
      vr-mode-ui="enabled: true"
      webxr="referenceSpaceType: local-floor; optionalFeatures: bounded-floor, hand-tracking"
      renderer="antialias: true; colorManagement: true; sortTransparentObjects: true; physicallyCorrectLights: true"
      shadow="type: pcfsoft"
    >
      <!-- ========================================== -->
      <!-- ASSETS - Precarga de todos los recursos   -->
      <!-- ========================================== -->
      <a-assets timeout="30000">
        <!-- Texturas -->
        <img id="textura-pared" src="/assets/pared.jpg" crossorigin="anonymous" />
        <img id="textura-suelo" src="/assets/piso.jpg" crossorigin="anonymous" />

        <!-- Modelos 3D -->
        <a-asset-item id="modelo-pizarra" src="/assets/pizarra.glb"></a-asset-item>
        <a-asset-item
          id="modelo-puerta"
          src="/assets/marco_en_madera_puerta.glb"
        ></a-asset-item>
        <a-asset-item
          id="modelo-pupitre"
          src="/assets/silla_pupitre_disgraf_8b.glb"
        ></a-asset-item>
        <a-asset-item id="modelo-logo" src="/assets/Iso.gltf"></a-asset-item>
        <img id="textura-logo" src="/assets/logo.png" crossorigin="anonymous" />
      </a-assets>

      <!-- ========================================== -->
      <!-- ENTORNO EXTERIOR                          -->
      <!-- ========================================== -->
      <a-entity
        environment="preset: forest; dressingAmount: 50; ground: flat; groundColor: #3a5a3a; groundColor2: #2a4a2a; skyType: gradient; skyColor: #87CEEB; horizonColor: #FFFFFF; fog: 0.6"
      ></a-entity>

      <!-- ################################################################## -->
      <!-- GRUPO: PASILLO PRINCIPAL (4m ancho x 29m largo x 3.5m alto)       -->
      <!-- Centrado en X=0, desde Z=-21.5 hasta Z=7.5                        -->
      <!-- ################################################################## -->
      <a-entity id="pasillo" position="0 0 0">
        <!-- SUELO DEL PASILLO -->
        <a-plane
          id="pasillo-suelo"
          class="navegable"
          width="4"
          height="29"
          rotation="-90 0 0"
          position="0 0.01 -7"
          material="src: #textura-suelo; repeat: 2 15; roughness: 0.7"
          shadow="receive: true"
        ></a-plane>

        <!-- TECHO DEL PASILLO -->
        <a-plane
          id="techo-pasillo"
          width="4"
          height="29"
          rotation="90 0 0"
          position="0 3.5 -7"
          material="color: #e8e4dc; roughness: 0.9"
        ></a-plane>

        <!-- PAREDES LATERALES DEL PASILLO (huecos para Aula 1-5) -->
        <!-- Pared izquierda: conecta Aula 1, Aula 3 y Aula 5 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="6.5"
          position="-2 1.75 4.25"
          material="src: #textura-pared; repeat: 3.25 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="3"
          position="-2 1.75 -4.5"
          material="src: #textura-pared; repeat: 1.5 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="3"
          position="-2 1.75 -11.5"
          material="src: #textura-pared; repeat: 1.5 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="4.5"
          position="-2 1.75 -19.25"
          material="src: #textura-pared; repeat: 2.25 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 1 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="-2 2.9 -1"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 -2.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 0.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 3 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="-2 2.9 -8"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 -9.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 -6.6"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 5 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="-2 2.9 -15"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 -16.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="-2 1.15 -13.6"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Pared derecha: conecta Aula 2 y Aula 4 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="6.5"
          position="2 1.75 4.25"
          material="src: #textura-pared; repeat: 3.25 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="3"
          position="2 1.75 -4.5"
          material="src: #textura-pared; repeat: 1.5 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="3"
          position="2 1.75 -11.5"
          material="src: #textura-pared; repeat: 1.5 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="3.5"
          depth="4.5"
          position="2 1.75 -19.25"
          material="src: #textura-pared; repeat: 2.25 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 2 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="2 2.9 -1"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 -2.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 0.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 4 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="2 2.9 -8"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 -9.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 -6.6"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Hueco puerta Aula 6 -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="1.2"
          depth="4"
          position="2 2.9 -15"
          material="src: #textura-pared; repeat: 2 0.6; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 -16.4"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.2"
          height="2.3"
          depth="1.2"
          position="2 1.15 -13.6"
          material="src: #textura-pared; repeat: 0.6 1.15; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- PARED TRASERA DEL PASILLO (fondo) -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="4"
          height="3.5"
          depth="0.2"
          position="0 1.75 -21.5"
          material="src: #textura-pared; repeat: 2 1.75; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- ENTRADA PRINCIPAL (Arco doble al frente Z=7.5) -->
        <!-- Columna izquierda -->
        <a-box
          class="collidable"
          width="0.5"
          height="3.5"
          depth="0.5"
          position="-1.75 1.75 7.5"
          material="color: #8b7355; roughness: 0.7"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Columna derecha -->
        <a-box
          class="collidable"
          width="0.5"
          height="3.5"
          depth="0.5"
          position="1.75 1.75 7.5"
          material="color: #8b7355; roughness: 0.7"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Dintel de entrada -->
        <a-box
          class="collidable"
          width="4"
          height="0.5"
          depth="0.6"
          position="0 3.25 7.5"
          material="color: #6b5344; roughness: 0.7"
          shadow="cast: true; receive: true"
        ></a-box>
        <!-- Relleno izquierdo entrada principal -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.6"
          height="3"
          depth="0.2"
          position="-1.5 1.5 7.5"
          material="src: #textura-pared; repeat: 0.3 1.5; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <!-- Relleno derecho entrada principal -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="0.6"
          height="3"
          depth="0.2"
          position="1.5 1.5 7.5"
          material="src: #textura-pared; repeat: 0.3 1.5; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>
        <!-- Relleno arriba de las puertas entrada -->
        <a-box
          class="collidable"
          src="#textura-pared"
          width="2.4"
          height="0.5"
          depth="0.2"
          position="0 2.75 7.5"
          material="src: #textura-pared; repeat: 1.2 0.25; roughness: 0.85"
          shadow="cast: true; receive: true"
        ></a-box>

        <!-- Marco de puerta principal (entrada doble) -->
        <a-entity
          gltf-model="#modelo-puerta"
          position="-0.7 0 7.3"
          rotation="0 180 0"
          scale="2 2 2"
          shadow="cast: true; receive: true"
        ></a-entity>
        <a-entity
          gltf-model="#modelo-puerta"
          position="0.7 0 7.3"
          rotation="0 180 0"
          scale="2 2 2"
          shadow="cast: true; receive: true"
        ></a-entity>

        <!-- LOGO 3D GIRANDO al fondo del pasillo -->
        <a-entity
          id="logo-pasillo"
          position="0 2 -20.5"
          scale="3 3 3"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
        >
          <a-gltf-model src="#modelo-logo"></a-gltf-model>
        </a-entity>
        <!-- Luz puntual que ilumina el logo -->
        <a-light
          type="point"
          color="#FFFFFF"
          intensity="1"
          position="0 3.2 -20.5"
          distance="5"
          decay="1"
        ></a-light>

        <!-- ILUMINACIÓN DEL PASILLO -->
        <a-light
          type="point"
          color="#FFF8DC"
          intensity="0.6"
          position="0 3.2 -17"
          distance="8"
          decay="2"
        ></a-light>
        <a-light
          type="point"
          color="#FFF8DC"
          intensity="0.6"
          position="0 3.2 -10"
          distance="8"
          decay="2"
        ></a-light>
        <a-light
          type="point"
          color="#FFF8DC"
          intensity="0.6"
          position="0 3.2 -4"
          distance="8"
          decay="2"
        ></a-light>
        <a-light
          type="point"
          color="#FFF8DC"
          intensity="0.6"
          position="0 3.2 0"
          distance="8"
          decay="2"
        ></a-light>
        <a-light
          type="point"
          color="#FFF8DC"
          intensity="0.6"
          position="0 3.2 4"
          distance="8"
          decay="2"
        ></a-light>
      </a-entity>

      <!-- ################################################################## -->
      <!-- AULAS GENERADAS DINAMICAMENTE                                      -->
      <!-- ################################################################## -->
      <a-entity
        id="aula1"
        generar-aula="posicionXYZ: -6 0 -1; colorParedes: #ffffff; tipo: matematica"
      ></a-entity>
      <a-entity
        id="aula2"
        generar-aula="posicionXYZ: 6 0 -1; colorParedes: #ffffff; tipo: algoritmos"
      ></a-entity>
      <a-entity
        id="aula3"
        generar-aula="posicionXYZ: -6 0 -8; colorParedes: #eef5ff; tipo: cpu"
      ></a-entity>
      <a-entity
        id="aula4"
        generar-aula="posicionXYZ: 6 0 -8; colorParedes: #f3fff1; tipo: fisica"
      ></a-entity>
      <a-entity
        id="aula5"
        generar-aula="posicionXYZ: -6 0 -15; colorParedes: #f0fffb; tipo: probabilidad"
      ></a-entity>
      <a-entity
        id="aula6"
        generar-aula="posicionXYZ: 6 0 -15; colorParedes: #fff7ed; tipo: complejidad"
      ></a-entity>

      <!-- ========================================== -->
      <!-- ILUMINACION GLOBAL                        -->
      <!-- ========================================== -->

      <!-- Luz ambiental general -->
      <a-light type="ambient" color="#FFFFFF" intensity="0.35"></a-light>

      <!-- Luz direccional principal (sol) -->
      <a-light
        type="directional"
        color="#FFF8E7"
        intensity="0.5"
        position="5 8 3"
        castShadow="true"
        shadow-map-height="2048"
        shadow-map-width="2048"
        shadow-camera-left="-20"
        shadow-camera-right="20"
        shadow-camera-top="20"
        shadow-camera-bottom="-20"
      ></a-light>

      <!-- ========================================== -->
      <!-- CÁMARA Y CONTROLES VR                     -->
      <!-- ========================================== -->

      <!-- Rig de cámara - inicia en la entrada del pasillo -->
      <!-- player-movement: WASD + colisión + gravedad, todo en uno -->
      <a-entity
        id="rig"
        position="0 0 6"
        player-movement="speed: 4; radius: 0.4"
      >
        <!-- Cámara: solo look-controls, wasd DESACTIVADO -->
        <a-camera
          id="camera"
          position="0 1.6 0"
          look-controls="pointerLockEnabled: false"
          wasd-controls="enabled: false"
        >
          <!-- Cursor: gaze (2s) + click para PC y VR -->
          <a-cursor
            color="#FFFFFF"
            fuse="true"
            fuse-timeout="1500"
            raycaster="objects: .clickable; far: 50; recursive: true"
            geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.015"
            material="color: white; shader: flat"
            animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
          ></a-cursor>
        </a-camera>

        <!-- Controlador izquierdo: locomoción con thumbstick + teleport (grip) + laser -->
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 50; recursive: true"
          thumbstick-locomotion="rig: #rig; camera: #camera; speed: 3"
          teleport-controls="
            cameraRig: #rig;
            teleportOrigin: #camera;
            type: parabolic;
            button: grip;
            collisionEntities: .navegable;
            curveHitColor: #4CAF50;
            curveMissColor: #FF5722;
            hitCylinderColor: #4CAF50;
            hitCylinderRadius: 0.3;
            curveShootingSpeed: 10;
            landingMaxAngle: 45"
        ></a-entity>

        <!-- Controlador derecho: teleport (grip) + laser -->
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 50; recursive: true"
          teleport-controls="
            cameraRig: #rig;
            teleportOrigin: #camera;
            type: parabolic;
            button: grip;
            collisionEntities: .navegable;
            curveHitColor: #4CAF50;
            curveMissColor: #FF5722;
            hitCylinderColor: #4CAF50;
            hitCylinderRadius: 0.3;
            curveShootingSpeed: 10;
            landingMaxAngle: 45"
        ></a-entity>
      </a-entity>
    </a-scene>
    </template>

    <!-- HUD para información de funciones/algoritmos -->
    <div
      id="mathHUD"
      class="info-panel"
      style="display: none; top: auto; bottom: 20px; left: 20px"
    >
      <h3
        id="functionTitle"
        style="color: #4caf50; margin: 0 0 8px 0; font-size: 16px"
      ></h3>
      <p id="functionDescription" style="margin: 4px 0; font-size: 13px"></p>
      <p
        id="functionDomain"
        style="margin: 4px 0; font-size: 12px; color: #7a8adb"
      ></p>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
